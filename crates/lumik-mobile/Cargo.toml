[package]
name = "lumik-mobile"
version = "0.0.0"
description = "Puente uniffi de lumik-core para la app de tablet"
edition = "2021"
publish = false

[lib]
# staticlib para Android/iOS (ubrn la enlaza en el turbo module); lib para los tests.
crate-type = ["lib", "staticlib"]
name = "lumik_mobile"

[dependencies]
lumik-core = { path = "../lumik-core" }
# Debe coincidir en minor con uniffi-bindgen-react-native (0.31.x).
uniffi = "0.31"
log = "0.4"
# Histograma de la vista previa (mismo decodificador que el núcleo con `embeddings`).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Import en la tablet: lo mismo que la app Tauri en Android (exif_android.rs).
rawler = "0.6"
kamadak-exif = "0.5"
chrono = "0.4"
# Identidad de la instalación (candado del proyecto).
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
# Huella de una entrega (`fingerprint_fd`), como el núcleo.
sha2 = "0.10"
# `VACUUM INTO` sobre la copia de trabajo, sin las migraciones de `ProjectDatabase::open`.
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
