[package]
name = "lumik-core"
version = "0.2.0"
description = "Núcleo de Lumik: dominio, casos de uso, import y persistencia SQLite, compartido por las apps de escritorio y de tablet"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite embebido: el mismo project.db en todas las plataformas.
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
log = "0.4"
# Huella SHA-256 del JPG entregado al aprobar
sha2 = "0.10"

# Búsqueda por contenido (feature `embeddings`): ONNX Runtime enlazado de forma
# estática, tokenizer en Rust puro y decodificación del thumbnail.
ort = { version = "=2.0.0-rc.15", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }

[features]
default = []
embeddings = ["dep:ort", "dep:tokenizers", "dep:image"]
