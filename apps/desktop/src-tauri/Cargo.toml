[package]
name = "lumik"
version = "0.2.0"
description = "App de escritorio para administrar fotografías profesionales"
authors = ["Lumik"]
edition = "2021"

[lib]
name = "lumik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Núcleo compartido con la app de tablet (dominio, casos de uso, import, SQLite).
lumik-core = { path = "../../../crates/lumik-core", features = ["embeddings"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base de datos SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilidades
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dirs = "5"

# Logging
log = "0.4"
env_logger = "0.11"

# RAW image processing and DNG conversion
rawler = "0.6"
image = "0.25"
tiff = { version = "0.11", features = ["jpeg"] }
kamadak-exif = "0.5"

# Cross-platform disk info (listing, space)
sysinfo = "0.31"

# Base64 encoding (thumbnails)
base64 = "0.22"

# Huella SHA-256 del JPG entregado al aprobar
sha2 = "0.10"
# Nombre del equipo para la identidad de la instalación (spec project-lock).
gethostname = "0.5"

# Cliente HTTP para el server de respaldo (Fase 4). rustls para evitar OpenSSL.
# Paquete del modelo de búsqueda por contenido (semantic-search)
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# Linux: libc for poll() on /proc/self/mountinfo (native mount/unmount watcher)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
# Windows: WMI subscription to Win32_VolumeChangeEvent (native device watcher)
wmi = "0.14"

# macOS: CoreFoundation (run loop, CFString/CFDictionary) for the DiskArbitration
# watcher and eject. DiskArbitration itself is linked directly via FFI.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
# statvfs (read-only volume detection)
libc = "0.2"

[profile.dev]
incremental = true

# Las dependencias se compilan optimizadas también en `tauri dev`: sin esto,
# decodificar y reducir un preview de 20 MP con `image` tarda ~6.4 s por foto
# (frente a ~90 ms en release) y el import en desarrollo no es representativo.
# El código propio sigue en debug para compilar rápido.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
