[package]
name = "lumik"
version = "0.1.4"
description = "App de escritorio para administrar fotografías profesionales"
authors = ["Lumik"]
edition = "2021"

[lib]
name = "lumik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base de datos SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilidades
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dirs = "5"

# Logging
log = "0.4"
env_logger = "0.11"

# RAW image processing and DNG conversion
rawler = "0.6"
image = "0.25"
tiff = { version = "0.11", features = ["jpeg"] }
kamadak-exif = "0.5"

# Cross-platform disk info (listing, space)
sysinfo = "0.31"

# Base64 encoding (thumbnails)
base64 = "0.22"

# Cliente HTTP para el server de respaldo (Fase 4). rustls para evitar OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# Linux: libc for poll() on /proc/self/mountinfo (native mount/unmount watcher)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
# Windows: WMI subscription to Win32_VolumeChangeEvent (native device watcher)
wmi = "0.14"

# macOS: CoreFoundation (run loop, CFString/CFDictionary) for the DiskArbitration
# watcher and eject. DiskArbitration itself is linked directly via FFI.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
