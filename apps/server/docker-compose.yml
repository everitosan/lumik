# Postgres de desarrollo para el catálogo del server de respaldo.
# Uso: docker compose up -d   (desde apps/server/)
services:
  db:
    image: postgres:17
    container_name: lumik-backup-db
    environment:
      POSTGRES_USER: lumik
      POSTGRES_PASSWORD: lumik
      POSTGRES_DB: lumik_backup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumik -d lumik_backup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
