name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Crea el release vacío primero ──────────────────────────────────────────
  # Los jobs de build corren en paralelo y suben sus artefactos a este release.
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && (/^## \[/ || /^\[.*\]: /) { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- Notas extraídas -----"; cat RELEASE_NOTES.md

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Lumik ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ── Build Linux ────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04  # glibc 2.35 — cubre Debian 12, Ubuntu 22.04+ y la mayoría de distros modernas
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Update Rust to stable
        run: |
          rustup update stable
          rustup default stable
          rustup show

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install Node dependencies
        run: pnpm install

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = .*/s/^version = .*/version = \"$VERSION\"/" \
            apps/desktop/src-tauri/Cargo.toml
          echo "Building version $VERSION"

      - name: Build Tauri — Linux
        run: pnpm --filter @lumik/desktop tauri build --bundles deb,appimage

      - name: Upload Linux artifacts to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb \
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ── Build Windows ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Update Rust to stable
        run: |
          rustup update stable
          rustup default stable
          rustup show

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Node dependencies
        run: pnpm install

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $cargoToml = "apps/desktop/src-tauri/Cargo.toml"
          $content = Get-Content $cargoToml -Raw
          $content = $content -replace '(?m)^version = .*', "version = `"$version`""
          Set-Content $cargoToml -Value $content -Encoding utf8 -NoNewline
          Write-Output "Building version $version"

      - name: Build Tauri — Windows
        run: pnpm --filter @lumik/desktop tauri build --config src-tauri/tauri.windows.conf.json

      - name: Upload Windows installer to release
        shell: pwsh
        run: |
          $exe = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $exe.FullName
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ── Build macOS ────────────────────────────────────────────────────────────
  # Binario universal (Apple Silicon + Intel) para macOS 12+. El runner es
  # arm64 y compila la porción x86_64 de forma cruzada; tauri la une con lipo.
  # Firma ad hoc (tauri.macos.conf.json): sin Developer ID ni notarización
  # mientras la app esté en beta.
  build-macos:
    runs-on: macos-14
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Update Rust to stable
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Node dependencies
        run: pnpm install

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # sed de BSD: -i necesita un sufijo (vacío) y no admite el rango 0,/re/
          sed -i '' "1,/^version = .*/s/^version = .*/version = \"$VERSION\"/" \
            apps/desktop/src-tauri/Cargo.toml
          echo "Building version $VERSION"

      - name: Build Tauri — macOS
        run: pnpm --filter @lumik/desktop tauri build --target universal-apple-darwin

      - name: Upload macOS dmg to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ── Build tablet Android (AAB para Google Play) ────────────────────────────
  # Secretos: LUMIK_UPLOAD_KEYSTORE_BASE64, LUMIK_UPLOAD_STORE_PASSWORD,
  # LUMIK_UPLOAD_KEY_ALIAS, LUMIK_UPLOAD_KEY_PASSWORD y, para subir a la pista
  # interna de Play, PLAY_SERVICE_ACCOUNT_JSON (si falta, solo va al release).
  build-tablet-android:
    runs-on: ubuntu-22.04
    needs: create-release
    env:
      NDK_VERSION: 26.3.11579264

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Rust para Android
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: JDK, NDK y cmake
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Node dependencies
        run: pnpm install

      - name: Núcleo de Rust y bindings
        run: pnpm --dir apps/tablet/modules/core-native ubrn:android --release

      - name: Proyecto Android (CNG) con la versión del tag
        run: |
          echo "LUMIK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          cd apps/tablet
          LUMIK_VERSION="${GITHUB_REF_NAME#v}" CI=1 pnpm exec expo prebuild --clean --platform android --no-install

      - name: AAB firmado
        env:
          LUMIK_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LUMIK_UPLOAD_KEYSTORE_BASE64 }}
          LUMIK_UPLOAD_STORE_PASSWORD: ${{ secrets.LUMIK_UPLOAD_STORE_PASSWORD }}
          LUMIK_UPLOAD_KEY_ALIAS: ${{ secrets.LUMIK_UPLOAD_KEY_ALIAS }}
          LUMIK_UPLOAD_KEY_PASSWORD: ${{ secrets.LUMIK_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$LUMIK_UPLOAD_KEYSTORE_BASE64" ]; then echo "Falta la clave de subida"; exit 1; fi
          echo "$LUMIK_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export LUMIK_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          cd apps/tablet/android
          ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/lumik-tablet-${GITHUB_REF_NAME}.aab"

      - name: Upload AAB to release
        run: gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/lumik-tablet-${GITHUB_REF_NAME}.aab"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Subir a la pista interna de Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "Sin cuenta de servicio: no se sube a Play"; exit 0; fi
          pip install --quiet google-api-python-client google-auth
          python apps/tablet/scripts/play_upload.py "$RUNNER_TEMP/lumik-tablet-${GITHUB_REF_NAME}.aab" internal
